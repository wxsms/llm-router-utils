[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-router-utils"
version = "0.1.0"
description = "Lightweight extraction of sglang's reasoning/tool-call parsers and chat template rendering for router services."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "wxsms" }]
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pydantic",
  "jinja2",
  "partial_json_parser",
  "orjson",
  "typing_extensions",
  "tiktoken",
  "transformers",
  "openai",
  "mistral_common>=1.11.5",
  "packaging",
  "huggingface_hub",
  "msgspec",
  "xgrammar",
]

[project.urls]
Homepage = "https://github.com/wxsms/llm-router-utils"
Source = "https://github.com/wxsms/llm-router-utils"
Issues = "https://github.com/wxsms/llm-router-utils/issues"

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

