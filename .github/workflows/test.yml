name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test deps
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: PYTHONPATH=src python -m pytest test/ --tb=short

  # The `inkling` and `deepseek-recipe` paths are backed by compiled wheels that
  # do not exist for every platform, so those tests skip on a plain runner and
  # their golden-reference assertions would never execute. This leg installs the
  # real wheels and then FAILS IF ANYTHING SKIPPED, so a format change in an
  # extracted package is caught here instead of passing vacuously.
  platform-extras:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # tml-renderers==0.1.0 publishes cp311-abi3 wheels only (no sdist), and
        # the `inkling` extra's marker therefore requires >= 3.11.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + platform extras
        # deepseek-recipe arrives via the default dependencies on Linux (its
        # platform marker selects it), so one install command pulls both.
        run: |
          python -m pip install -e ".[test,inkling]"
          python -c "import deepseek_recipe; print('deepseek-recipe import ok')"
          python -c "import tml_renderers; print('tml-renderers import ok')"

      - name: DeepSeek-V4.1 tests must run, not skip
        run: |
          # pipefail: without it `... | tee` reports tee's (always 0) exit status
          # and a failing test would not fail the job.
          set -o pipefail
          PYTHONPATH=src python -m pytest \
            test/unit/function_call/test_deepseekv41_detector.py \
            -q -rs --no-header | tee /tmp/dsv41.txt
          if grep -qE '[0-9]+ skipped' /tmp/dsv41.txt; then
            echo "::error::deepseekv41 tests skipped - deepseek-recipe not usable"
            exit 1
          fi

      - name: Inkling golden-reference tests must run, not skip
        run: |
          set -o pipefail
          PYTHONPATH=src python -m pytest test/unit/parser/test_inkling_renderer.py \
            -q -rs --no-header | tee /tmp/inkling.txt
          if grep -qE '[0-9]+ skipped' /tmp/inkling.txt; then
            echo "::error::inkling tests skipped - tml-renderers not usable"
            exit 1
          fi

      - name: Full suite with every platform extra present
        run: PYTHONPATH=src python -m pytest test/ --tb=short

  invariants:
    # Version-independent checks that need the upstream submodule: torch-import
    # ban, parity against vendor/sglang, and Apache 2.0 license compliance.
    # Runs once (not on the Python matrix) since these are static checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: No direct torch import in src/
        run: make check-torch

      - name: Parity check (no NEW drift vs upstream)
        run: make check-parity

      - name: License compliance (Apache 2.0 §4)
        run: make check-license
