name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test deps
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: PYTHONPATH=src python -m pytest test/ --tb=short

  invariants:
    # Version-independent checks that need the upstream submodule: torch-import
    # ban, parity against vendor/sglang, and Apache 2.0 license compliance.
    # Runs once (not on the Python matrix) since these are static checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: No direct torch import in src/
        run: make check-torch

      - name: Parity check (no NEW drift vs upstream)
        run: make check-parity

      - name: License compliance (Apache 2.0 §4)
        run: make check-license
