name: Tests

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test deps
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: PYTHONPATH=src python -m pytest test/ --tb=short

      - name: Verify no direct torch import in src/
        run: |
          if grep -rn "^import torch\|^from torch" src/ 2>/dev/null | grep -v __pycache__; then
            echo "FAIL: direct torch import found"
            exit 1
          fi
          echo "OK: no direct torch import"
