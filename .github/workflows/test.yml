name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test deps
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: PYTHONPATH=src python -m pytest test/ --tb=short

  # The `inkling`, `deepseek-recipe` and other platform-gated paths skip on
  # runners without their wheels, so the golden-reference assertions would
  # never execute. This leg installs the optional extras that DO resolve on
  # Linux and requires those tests to actually run (not skip), so a format
  # change in an extracted package fails here instead of passing vacuously.
  platform-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # tml-renderers==0.1.0 ships cp311-abi3 wheels only, so 3.10 is out.
          python-version: "3.12"

      - name: Install package + inkling extra
        run: python -m pip install -e ".[test,inkling]"

      - name: Inkling golden-reference tests must run, not skip
        run: |
          # A skip here means the wheel was missing, so the golden-reference
          # assertions never executed and the step would pass vacuously.
          # pipefail: without it `... | tee` reports tee's (always 0) status.
          set -o pipefail
          PYTHONPATH=src python -m pytest test/unit/parser/test_inkling_renderer.py \
            -q -rs --no-header | tee /tmp/inkling.txt
          if grep -qE '[0-9]+ skipped' /tmp/inkling.txt; then
            echo "::error::inkling tests skipped - tml-renderers wheel not installed"
            exit 1
          fi

      - name: DeepSeek-V4.1 tests must run, not skip
        run: |
          # deepseek-recipe is a hard dependency on Linux, so these must execute.
          set -o pipefail
          PYTHONPATH=src python -m pytest \
            test/unit/function_call/test_deepseekv41_detector.py \
            -q -rs --no-header | tee /tmp/dsv41.txt
          if grep -qE '[0-9]+ skipped' /tmp/dsv41.txt; then
            echo "::error::deepseekv41 tests skipped - deepseek-recipe wheel not installed"
            exit 1
          fi

  invariants:
    # Version-independent checks that need the upstream submodule: torch-import
    # ban, parity against vendor/sglang, and Apache 2.0 license compliance.
    # Runs once (not on the Python matrix) since these are static checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: No direct torch import in src/
        run: make check-torch

      - name: Parity check (no NEW drift vs upstream)
        run: make check-parity

      - name: License compliance (Apache 2.0 §4)
        run: make check-license
